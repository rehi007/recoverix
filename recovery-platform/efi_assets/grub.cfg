# Generated by recovery-platform grub.generate_grub_config
# Default boot: Windows Boot Manager (menu index 0)
# Press F5 within 5s to boot Recovery Linux

set timeout=5
set default=0

insmod part_gpt
insmod fat
insmod chain
insmod regexp
# Optional: F5 hotkey support — failure must not block Windows auto-boot.
insmod keystatus || true

menuentry "Windows Boot Manager" {
    # Primary: file-based ESP search (kept as default).
    search --file --no-floppy --set=root /EFI/Microsoft/Boot/bootmgfw.efi
    # TODO(fallback): search --file may fail on some firmware/GRUB builds.
    #   - Add search.fs_uuid <ESP_UUID> fallback after live ESP discovery
    #   - Re-verify Windows Boot Manager path before chainloader
    #   - On search failure: prioritize Windows boot survivability (never fall through to Recovery)
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Recovery Linux - Restore System" --hotkey=f5 {
    linux /recovery/vmlinuz quiet recovery_mode=1
    initrd /recovery/initrd.img
}
