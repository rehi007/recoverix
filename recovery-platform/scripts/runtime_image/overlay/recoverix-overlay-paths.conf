# Recoverix overlay runtime paths (initramfs + documentation).
# lower: readonly squashfs
# upper/work: tmpfs (writable session state)
# merged root: run-init pivot target (must NOT live under initramfs /run — see initramfs-tools /init move /run)
RECOVERIX_BASE_MOUNT=/run/rootfs-base
RECOVERIX_OVERLAY_UPPER=/run/recoverix-overlay/upper
RECOVERIX_OVERLAY_WORK=/run/recoverix-overlay/work
RECOVERIX_MERGED_ROOT=/mnt/rootfs-root

# Squashfs search order at boot (initramfs tries in order)
RECOVERIX_SQUASHFS_PATH_1=/boot/recoverix/runtime.squashfs
RECOVERIX_SQUASHFS_PATH_2=/recovery/runtime/runtime.squashfs
